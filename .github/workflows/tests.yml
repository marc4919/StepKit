name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Build + unit tests (iOS Simulator)
    # The project targets iOS 26 and needs Xcode 26 or newer.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Pick an iPhone simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(r, d["name"], d["udid"]) for r, ds in devices.items() if "iOS" in r for d in ds if d["name"].startswith("iPhone")]
          print(max(ios)[2])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project StepKit.xcodeproj -scheme StepKit -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests
        run: |
          xcodebuild test-without-building \
            -project StepKit.xcodeproj -scheme StepKit \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -only-testing:StepKitTests -parallel-testing-enabled NO \
            -resultBundlePath build/StepKitTests.xcresult

      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StepKitTests.xcresult
          path: build/StepKitTests.xcresult
          if-no-files-found: ignore
